name: UI snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-snapshot-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  snapshot:
    name: Real server + Playwright screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run build
      - run: node scripts/build-server.mjs
      - name: Install Playwright chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture zh-CN UI screenshots
        run: node scripts/ui-snapshot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zh-cn-ui-snapshots
          path: ui-snapshots/
          retention-days: 14
